name: Gerar app (IPA)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto Xcode
        run: xcodegen generate

      - name: Compilar
        run: |
          xcodebuild \
            -project SoDMs.xcodeproj \
            -scheme SoDMs \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Empacotar IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SoDMs.app Payload/
          zip -qry SoDMs.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SoDMs
          path: SoDMs.ipa

      - name: Publicar versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Só DMs v${{ github.run_number }}
          files: SoDMs.ipa
          make_latest: true
